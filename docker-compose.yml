services:
  eurekaserver:
    build: ./eureka-server
    ports:
      - '8761:8761'
    networks:
      - spring-network

  departmentservice:
    build: ./department-service
    depends_on:
      - eurekaserver
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_NAME=mydb
      - DATABASE_USER=root
      - DATABASE_PASSWORD=Paungx2AtSql
    networks:
      - spring-network

  gatewayservice:
    build: ./gate-way
    ports:
      - "8080:8080"
    depends_on:
      - eurekaserver
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    networks:
      - spring-network

  webuiservice:
    build: ./web-ui
    depends_on:
      - eurekaserver
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    networks:
      - spring-network

networks:
  spring-network:
    driver: bridge